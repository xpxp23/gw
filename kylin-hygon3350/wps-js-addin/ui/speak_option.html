<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>银河麒麟语音朗读设置</title>
    <script type="text/javascript" src="../js/wps_enum.js"></script>
    <script type="text/javascript" src="../js/config.js"></script>
    <script type="text/javascript" src="../js/security_speech.js"></script>
    <style>
        body {
            font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
            font-size: 13px;
            margin: 0;
            padding: 16px;
            background: #f6f8fa;
            color: #1f2328;
        }
        .card {
            background: #fff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 14px;
        }
        .row {
            margin: 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        select, input[type="range"] {
            width: 210px;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }
        .btn {
            padding: 6px 14px;
            border-radius: 4px;
            border: 1px solid #d0d7de;
            background: #fff;
            cursor: pointer;
        }
        .btn-primary {
            background: #b91c1c;
            color: #fff;
            border-color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-weight:600; color:#b91c1c; margin-bottom:10px;">
            银河麒麟 TTS 语音校对参数 (WebSpeech / speech-dispatcher / espeak-ng)
        </div>
        <div class="row">
            <label>语音语言/引擎:</label>
            <select id="cobVoiceName">
                <option value="zh-CN">中文普通话 (zh-CN / cmn)</option>
                <option value="zh-TW">中文粤语/繁体 (zh-HK / yue)</option>
                <option value="en-US">英文 (en-US)</option>
            </select>
        </div>
        <div class="row">
            <label>朗读语速 (<span id="rateVal">175</span> 词/分):</label>
            <input type="range" id="trackRate" min="100" max="300" step="5" value="175" oninput="document.getElementById('rateVal').innerText=this.value" />
        </div>
        <div class="actions">
            <button class="btn btn-primary" onclick="saveAndPlay()">保存并试听朗读</button>
            <button class="btn" onclick="GwSecuritySpeech.stopSpeak()">停止朗读</button>
            <button class="btn" onclick="saveOnly()">保存关闭</button>
        </div>
    </div>

    <script>
        window.onload = function () {
            var cfg = GwConfig.load();
            document.getElementById("cobVoiceName").value = cfg.speechVoice || "zh-CN";
            document.getElementById("trackRate").value = cfg.speechRate || 175;
            document.getElementById("rateVal").innerText = cfg.speechRate || 175;
        };

        function saveCfg() {
            var cfg = GwConfig.load();
            cfg.speechVoice = document.getElementById("cobVoiceName").value;
            cfg.speechRate = parseInt(document.getElementById("trackRate").value, 10) || 175;
            GwConfig.save(cfg);
        }

        function saveAndPlay() {
            saveCfg();
            GwSecuritySpeech.toggleSpeak();
        }

        function saveOnly() {
            saveCfg();
            window.close();
        }
    </script>
</body>
</html>
